<form [formGroup]="form" name="{{name}}" autocomplete="autocomplete ? 'on' : 'off'">
    <div class="mb-3" *ngFor="let elem of extFields; first as isFirst;">
        <ng-container *ngIf="autocomplete;else disableTmpl">            
            <ng-container [ngSwitch]="elem.category">
                <!-- Checkbox -->
                <ng-container *ngSwitchCase="'checkbox'">
                    <div class="form-check">
                        <input formControlName="{{elem.name}}"
                               class="form-check-input"
                               type="checkbox"
                               name="{{elem.name}}"
                               id="{{elem.fieldId}}">
                        <label class="form-check-label" for="{{elem.fieldId}}">
                            {{elem.label}}
                            <span *ngIf="elem.hasReqInd" class="text-danger">
                                *
                            </span>
                        </label>
                        <span *ngIf="elem.helpInfo" class="ms-1">
                            <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate1"
                                     [popoverTitle]="elem.helpInfo.title" container="body">
                            </fa-icon>
                            <ng-template #popTemplate1><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                        </span>
                    </div>                    
                </ng-container>
                <!-- Radio -->
                <ng-container *ngSwitchCase="'radio'">
                    <label class="form-label" *ngIf="elem.label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate2"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate2><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                    </span>
                    <div class="form-check mb-2" *ngFor="let o of elem.options; let i = index">
                        <input formControlName="{{elem.name}}"
                               class="form-check-input"
                               type="radio"
                               value="{{o.value}}"
                               name="{{elem.name}}"
                               id="{{elem.fieldId + i}}">
                        <label class="form-check-label" for="{{elem.fieldId + i}}">
                            {{o.label}}
                        </label>
                    </div>                    
                </ng-container>
                <!-- Select -->
                <ng-container *ngSwitchCase="'select'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate3"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate3><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                    </span>                        
                    <select class="form-control" autocomplete="{{elem.autocomplete || 'off'}}" id="{{elem.fieldId}}">
                        <option selected>Choose ...</option>
                        <option *ngFor="let o of elem.options" value="{{o.value}}">
                            {{o.label}}
                        </option>
                    </select>                    
                </ng-container>
                <!-- textarea -->
                <ng-container *ngSwitchCase="'textarea'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate4"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate4><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                    </span>                        
                    <textarea formControlName="{{elem.name}}" 
                              id="{{elem.fieldId}}"
                              name="{{elem.name}}"
                              autocomplete="{{elem.autocomplete || 'off'}}"
                              spellcheck="{{elem.spellcheck || 'true'}}"
                              cdkTextareaAutosize 
                              [autofocus]="isFirst"
                              class="form-control">
                    </textarea>
                </ng-container>
                <!-- password -->
                <ng-container *ngSwitchCase="'password'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate5"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate5><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                    </span>                        
                    <div class="input-group">                        
                        <input formControlName="{{elem.name}}"
                               id="{{elem.fieldId}}"
                               name="{{elem.name}}"                           
                               type="{{elem.visible ? 'text' : 'password'}}"
                               spellcheck="false"
                               [autofocus]="isFirst"
                               autocomplete="{{elem.autocomplete || 'new-password'}}"                               
                               class="form-control" />
                        <button class="btn btn-outline-secondary icon-only" type="button"
                                (click)="elem.visible = !elem.visible">
                            <fa-icon [icon]="elem.visible ? faEyeSlash : faEye">
                            </fa-icon>
                        </button>
                    </div>
                </ng-container>
                <!-- HTML -->
                <ng-container *ngSwitchCase="'html'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate6"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate6><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                                
                    </span>                        
                    <div class="input-group">
                        <editor formControlName="{{elem.name}}"
                                id="{{elem.fieldId}}"
                                class="form-control p-0 border-0"
                                [init]="editorOptions"
                                [plugins]="editorPlugins"
                                [toolbar]="editorToolbar"                                
                        >
                        </editor>
                    </div>
                </ng-container>
                <!-- Otherwise -->
                <ng-container *ngSwitchDefault>
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate7"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate7><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                        
                    <input *ngIf="!elem.maskSettings; else maskTmpl"
                           formControlName="{{elem.name}}" 
                           autocomplete="{{elem.autocompleteKey}}"
                           id="{{elem.fieldId}}"
                           name="{{elem.name}}"                           
                           type="{{elem.category}}"
                           autocomplete="{{elem.autocomplete || 'off'}}"
                           spellcheck="{{elem.spellcheck || 'false'}}"
                           [autofocus]="isFirst"
                           class="form-control" />
                    <ng-template #maskTmpl>
                        <input *ngIf="elem.maskSettings"
                               formControlName="{{elem.name}}"
                               autocomplete="{{elem.autocompleteKey}}"
                               id="{{elem.fieldId}}"
                               name="{{elem.name}}"                           
                               type="{{elem.category}}"
                               autocomplete="{{elem.autocomplete || 'off'}}"
                               spellcheck="{{elem.spellcheck || 'false'}}"
                               [autofocus]="isFirst"
                               mask="{{elem.maskSettings.mask}}"
                               class="form-control" />
                    </ng-template>
                </ng-container>
            </ng-container>
        </ng-container>
        <ng-template #disableTmpl>
            <ng-container [ngSwitch]="elem.category">
                <!-- Checkbox -->
                <ng-container *ngSwitchCase="'checkbox'">
                    <div class="form-check">
                        <input formControlName="{{elem.name}}"
                               class="form-check-input"
                               type="checkbox"
                               name="{{elem.name}}"
                               id="{{elem.fieldId}}">
                        <label class="form-check-label" for="{{elem.fieldId}}">
                            {{elem.label}}
                            <span *ngIf="elem.hasReqInd" class="text-danger">
                                *
                            </span>
                        </label>
                        <span *ngIf="elem.helpInfo" class="ms-1">
                            <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate8"
                                     [popoverTitle]="elem.helpInfo.title" container="body">
                            </fa-icon>
                            <ng-template #popTemplate8>
                                <div [innerHtml]="elem.helpInfo.content"></div>
                            </ng-template>                            
                        </span>                                                    
                    </div>                    
                </ng-container>
                <!-- Radio -->
                <ng-container *ngSwitchCase="'radio'">
                    <label class="form-label" *ngIf="elem.label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate9"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate9>
                            <div [innerHtml]="elem.helpInfo.content"></div>
                        </ng-template>
                    </span>                        
                    <div class="form-check mb-2" *ngFor="let o of elem.options; let i = index">
                        <input formControlName="{{elem.name}}"
                               class="form-check-input"
                               type="radio"
                               value="{{o.value}}"
                               name="{{elem.name}}"
                               id="{{elem.fieldId + i}}">
                        <label class="form-check-label" for="{{elem.fieldId + i}}">
                            {{o.label}}
                        </label>
                    </div>                    
                </ng-container>
                <!-- Select -->
                <ng-container *ngSwitchCase="'select'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate10"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate10><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                                                
                    <select class="form-control" autocomplete="{{elem.autocomplete || 'off'}}" id="{{elem.fieldId}}">
                        <option selected>Choose ...</option>
                        <option *ngFor="let o of elem.options" value="{{o.value}}">
                            {{o.label}}
                        </option>
                    </select>                    
                </ng-container>
                <!-- textarea -->
                <ng-container *ngSwitchCase="'textarea'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate11"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate11><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                                                
                    <textarea formControlName="{{elem.name}}" 
                              id="{{elem.fieldId}}"
                              name="{{elem.name}}"
                              autocomplete="{{elem.autocomplete || 'off'}}"
                              spellcheck="{{elem.spellcheck || 'true'}}"
                              cdkTextareaAutosize
                              [autofocus]="isFirst"
                              class="form-control">
                    </textarea>
                </ng-container>
                <!-- password -->
                <ng-container *ngSwitchCase="'password'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate12"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate12><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                                                
                    <div class="input-group"> 
                        <input formControlName="{{elem.name}}"
                               id="{{elem.fieldId}}"
                               name="{{elem.name}}"                           
                               type="{{elem.visible ? 'text' : 'password'}}"
                               spellcheck="false"                               
                               [autofocus]="isFirst"
                               autocomplete="{{elem.autocomplete || 'new-password'}}"
                               class="form-control" />
                        <button class="btn btn-outline-secondary icon-only" type="button"
                                (click)="elem.visible = !elem.visible">
                            <fa-icon [icon]="elem.visible ? faEyeSlash : faEye">
                            </fa-icon>
                        </button>
                    </div>
                </ng-container>
                <!-- HTML -->
                <ng-container *ngSwitchCase="'html'">
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate13"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate13><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                                                
                    <div class="input-group">
                        <editor formControlName="{{elem.name}}"
                                id="{{elem.fieldId}}"
                                class="form-control p-0 border-0"
                                [init]="editorOptions"
                                [plugins]="editorPlugins"
                                [toolbar]="editorToolbar"                                
                        >
                        </editor>
                    </div>
                </ng-container>
                <!-- Others -->
                <ng-container *ngSwitchDefault>
                    <label for="{{elem.fieldId}}" class="form-label">
                        {{elem.label}}
                        <span *ngIf="elem.hasReqInd" class="text-danger">
                            *
                        </span>
                    </label>
                    <span *ngIf="elem.helpInfo" class="ms-1">
                        <fa-icon [icon]="faQuestionCircle" [popover]="popTemplate14"
                                 [popoverTitle]="elem.helpInfo.title" container="body">
                        </fa-icon>
                        <ng-template #popTemplate14><div [innerHtml]="elem.helpInfo.content"></div></ng-template>                            
                    </span>                                                
                    <input *ngIf="!elem.maskSettings; else anotherMaskTmpl"
                           formControlName="{{elem.name}}"
                           id="{{elem.fieldId}}"
                           name="{{elem.name}}"                           
                           type="{{elem.category}}"
                           autocomplete="{{elem.autocomplete || 'off'}}"
                           spellcheck="{{elem.spellcheck || 'false'}}"
                           [autofocus]="isFirst"
                           class="form-control" />
                    <ng-template #anotherMaskTmpl>
                        <input formControlName="{{elem.name}}"
                               id="{{elem.fieldId}}"
                               name="{{elem.name}}"                           
                               type="{{elem.category}}"
                               autocomplete="{{elem.autocomplete || 'off'}}"
                               spellcheck="{{elem.spellcheck || 'false'}}"
                               [autofocus]="isFirst"
                               mask="{{elem.maskSettings.mask}}"
                               class="form-control" />
                    </ng-template>
                </ng-container>
            </ng-container>
        </ng-template>                

        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.required && (form.touched || form.dirty)">
            {{elem.validators.required.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.min && (form.touched || form.dirty)">
            {{elem.validators.min.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.max && (form.touched || form.dirty)">
            {{elem.validators.max.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.pattern && (form.touched || form.dirty)">
            {{elem.validators.pattern.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.minlength && (form.touched || form.dirty)">
            {{elem.validators.minLength.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.maxlength && (form.touched || form.dirty)">
            {{elem.validators.maxLength.message}}
        </div>
        <div class="form-text text-danger" *ngIf="form.controls[elem.name].errors?.url && (form.touched || form.dirty)">
            {{elem.validators.url.message}}
        </div>
    </div>
    
    <div class="d-flex justify-content-end">
        <button *ngIf="!hideCancelBtn"
                type="button" class="btn me-2"
                [ngClass]="cancelBtnClasses" (click)="cancel()" >
            {{cancelBtnTxt}}
        </button>    
        <button *ngIf="!hideSubmitBtn"
                type="button" class="btn"
                [ngClass]="submitBtnClasses" [disabled]="!form.valid" (click)="submit()">
            {{submitBtnTxt}}
        </button>
    </div>
    
</form>
