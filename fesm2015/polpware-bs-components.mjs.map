<alert [type]="bsAlertType" [dismissible]="alertDismissible" *ngIf="alertType > 0">
    <p>
        {{alertMessage}}
    </p>
</alert>

<div>
    <div class="mb-4">
        <label class="form-label">Recipients</label>
        <tag-input [(ngModel)]="emails" #emailInputBox
                   name="emailInputs"
                   (focusout)="onOutOfTagInput($event)"
                   (onTextChange)="textChanged($event)"
                   [addOnPaste]="true"
                   [modelAsStrings]="true"
                   [trimTags]="true"
                   [editable]="true"
                   [errorMessages]="errorMessages"
                   [validators]="validators"
                   [secondaryPlaceholder]="'Emails'"
                   [separatorKeyCodes]="[32,44,58,59]"
                   [displayBy]="'display'"
                   [identifyBy]="'value'"                       
                   [placeholder]="'+ Email'">
            <tag-input-dropdown [autocompleteItems]="autocompleteItemsAsync | async">
                <ng-template let-item="item" let-index="index">
                    {{ item.display }}
                </ng-template>
            </tag-input-dropdown>
        </tag-input>
    </div>

    <div class="mb-4">
        <label for="messageTitleInput" class="form-label">Subject</label>
        <input name="messageTitleInput" id="messageTitleInput" aria-describedby="messageTitleHelp"
               class="form-control"
               [(ngModel)]="messageTitle" #messageTitleCtrl="ngModel" required>
        <div id="messageTitleHelp"
             class="form-text text-danger" *ngIf="!messageTitleCtrl.valid && messageTitleCtrl.touched">
            Subject is required.
        </div>
    </div>

    <div class="mb-4" *ngIf="isHtmlBody; else textBody">
        <label class="form-label">Message</label>
        <editor [(ngModel)]="messageBody"
                #emailBody
                #messageBodyCtrl="ngModel"               
                name="messageBodyInput"
                class="form-control p-0 border-0"                
                [init]="{htmlAllowedTags: ['.*'], htmlAllowedAttrs: ['.*'], extended_valid_elements: '*[.*]', draggable_modal: true }"
                plugins ="advlist autolink link image lists charmap preview anchor pagebreak searchreplace wordcount visualblocks visualchars code fullscreen insertdatetime media nonbreaking table emoticons template help autoresize"
                toolbar ="undo redo | styleselect | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image | preview media fullpage | forecolor backcolor emoticons | help"
        >
        </editor>
        <div id="messageBodyHelp" class="form-text">
            Body message is required.
        </div>
    </div>
    <ng-template #textBody>
        <div class="mb-4">
            <label for="messageBodyInput" class="form-label">Message</label>        
            <textarea name="messageBodyInput" id="messageBodyInput" aria-describedby="messageBodyHelp"
                      class="form-control"
                      #emailBody
                      cdkTextareaAutosize
                      [cdkAutosizeMinRows]="5"
                      [cdkAutosizeMaxRows]="10"
                      [(ngModel)]="messageBody" #messageBodyCtrl="ngModel" required>
            </textarea>
            <div id="messageBodyHelp"
                 class="form-text text-danger" *ngIf="!messageBodyCtrl.valid && messageBodyCtrl.touched">
                Body message is required.
            </div>
        </div>
    </ng-template>

    <div class="d-flex justify-content-end mb-4">
        <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="alertType == 3"
                *ngIf="!showCloseBtn; else closeBtnTmpl">
            Submit
            <fa-icon class="ms-2" [icon]="faSpinner" [spin]="true" *ngIf="alertType == 3"></fa-icon>
        </button>
        <ng-template #closeBtnTmpl>
            <button type="button" class="btn btn-secondary" (click)="close()">
                Close
            </button>
        </ng-template>
    </div>
</div>
