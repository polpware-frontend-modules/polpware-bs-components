<form [ngClass]="formClass" (ngSubmit)="kickOffSearch()">
  <div class="input-group">
    @if (prependText) {
      <span class="input-group-text">{{prependText}}</span>
    }
    <input [ngClass]="inputClass" type="text" #searchControlElem
      [formControl]="searchControl"
      [autofocus]="true" />
    @if (anyFutureKeyword) {
      <button class="btn btn-secondary icon-only" type="button"
        tooltip="Cancel"
        (click)="resetKeyword(true)">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    }
    <button class="btn btn-primary icon-only" type="submit"
      tooltip="Search">
      <fa-icon [icon]="faSearch"></fa-icon>
    </button>
  </div>
</form>
