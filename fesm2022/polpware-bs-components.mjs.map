<div class="modal-header">
  <h4 class="modal-title">{{title}}</h4>
  @if (!hideCloseBtn) {
    <button type="button" class="btn-close" aria-label="Close" (click)="close()">
    </button>
  }
</div>
<div class="modal-body">
  <div [innerHtml]="innerBody">
  </div>
  <polp-bs-prompt-form [fields]="fields"
    [hideCancelBtn]="hideCancelBtn"
    [hideSubmitBtn]="hideConfirmBtn"
    [cancelBtnTxt]="cancelBtnLabel"
    [submitBtnTxt]="confirmBtnLabel"
    [cancelBtnClasses]="cancelBtnClasses"
    [submitBtnClasses]="confirmBtnClasses"
    [autocomplete]="autocomplete"
    [enableEnter]="enableEnter"
    (onCancel)="close()"
    (onSave)="confirm($event)">
  </polp-bs-prompt-form>
</div>
