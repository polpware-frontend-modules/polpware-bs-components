<div class="modal-header">
  <h4 class="modal-title">{{title}}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="close()">
  </button>
</div>
<div class="modal-body">
  <div [innerHtml]="innerBody">
  </div>
</div>
<div class="modal-footer">
  @if (!hideNoBtn) {
    <button type="button" class="btn me-2" [ngClass]="noBtnClasses" (click)="close()">
      {{noBtnLabel}}
    </button>
  }
  <button type="button" class="btn" [ngClass]="yesBtnClasses" (click)="confirm()">
    {{yesBtnLabel}}
  </button>
</div>
